<!-- Full-width development card matching the approved Palmares editorial reference. -->
<tr data-component="development-card">
  <td bgcolor="{{ page.brand.white }}" class="dm-surface sm-gutter" style="background-color:{{ page.brand.white }};padding:0 32px {{ gap === '' ? 24 : gap }}px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" class="dm-border" style="width:100%;border:1px solid {{ page.brand.border }};">
      <tr>
        <td style="padding:0;font-size:0;line-height:0;">
          <a href="{{ href }}" style="text-decoration:none;border:0;">
            <img src="{{ src }}" alt="{{ alt }}" width="534" height="356" class="sm-full" style="display:block;width:100%;max-width:534px;height:auto;border:0;">
          </a>
        </td>
      </tr>
      <tr>
        <td bgcolor="{{ page.brand.white }}" class="dm-surface sm-card-inner" style="background-color:{{ page.brand.white }};padding:28px 32px 32px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
            <tr><td style="padding:0 0 18px;"><h3 style="margin:0;font-family:{{ page.font.serif }};font-size:28px;line-height:34px;font-weight:{{ page.weight.body }};"><a href="{{ href }}" class="dm-accent" style="color:{{ page.brand.green }};text-decoration:underline;text-underline-offset:5px;">{{ title }}</a></h3></td></tr>
            <if condition="location"><tr><td class="dm-ink" style="padding:0 0 9px;font-family:{{ page.font.sans }};font-size:14px;line-height:19px;font-weight:{{ page.weight.medium }};letter-spacing:2.2px;text-transform:uppercase;color:{{ page.brand.charcoal }};">{{ location }}</td></tr></if>
            <if condition="country"><tr><td class="dm-muted" style="padding:0 0 10px;font-family:{{ page.font.sans }};font-size:14px;line-height:19px;font-weight:{{ page.weight.body }};letter-spacing:2.2px;text-transform:uppercase;color:{{ page.brand.muted }};">{{ country }}</td></tr></if>
            <tr><td height="1" bgcolor="{{ page.brand.border }}" class="dm-hairline" style="background-color:{{ page.brand.border }};height:1px;line-height:1px;font-size:0;">&nbsp;</td></tr>
            <if condition="price"><tr><td class="dm-accent" style="padding:24px 0 16px;font-family:{{ page.font.serif }};font-size:27px;line-height:33px;font-weight:{{ page.weight.body }};color:{{ page.brand.green }};">{{ price }}</td></tr></if>
            <if condition="status"><tr><td style="padding:0 0 12px;"><table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;"><tr><td bgcolor="{{ page.brand.green }}" style="background-color:{{ page.brand.green }};padding:8px 11px;font-family:{{ page.font.sans }};font-size:10px;line-height:14px;font-weight:{{ page.weight.medium }};letter-spacing:1.2px;text-transform:uppercase;color:{{ page.brand.onGreen }};">{{ status }}</td></tr></table></td></tr></if>
            <if condition="completion"><tr><td class="dm-muted" style="padding:0 0 12px;font-family:{{ page.font.sans }};font-size:{{ page.scale.legal.size }}px;line-height:{{ page.scale.legal.leading }}px;color:{{ page.brand.muted }};">{{ completion }}</td></tr></if>
            <if condition="cta"><tr><td style="padding:4px 0 0;font-family:{{ page.font.sans }};font-size:{{ page.scale.ui.size }}px;line-height:{{ page.scale.ui.leading }}px;font-weight:{{ page.weight.medium }};"><a href="{{ href }}" class="dm-accent" style="color:{{ page.brand.green }};text-decoration:underline;text-underline-offset:2px;">{{ cta }}</a></td></tr></if>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
