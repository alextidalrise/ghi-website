<!--
  Masthead — LOCKED system content. Not campaign-editable.

  The editorial variant follows GHI's date-led newsletter hierarchy: date line,
  inset green brand panel, logo/strapline, then the specialist descriptor. The
  original compact masthead remains available for other campaign recipes.
-->
<if condition="variant === 'editorial' || page.mastheadVariant === 'editorial'">
  <tr data-email-masthead-start>
    <td data-masthead-date align="center" bgcolor="{{ page.brand.white }}" class="dm-surface sm-gutter" style="background-color:{{ page.brand.white }};padding:24px 32px 16px;font-family:{{ page.font.sans }};font-size:11px;line-height:16px;mso-line-height-rule:exactly;font-weight:{{ page.weight.medium }};letter-spacing:1.6px;text-transform:uppercase;color:{{ page.brand.muted }};">
      {{ page.mastheadDate }}
    </td>
  </tr>
  <tr>
    <td align="center" bgcolor="{{ page.brand.white }}" class="dm-surface sm-gutter" style="background-color:{{ page.brand.white }};padding:0 32px;">
      <table data-email-masthead-table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
        <tr>
          <td align="center" bgcolor="{{ page.brand.green }}" style="background-color:{{ page.brand.green }};padding:38px 24px 34px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
              <tr>
                <td align="center" style="padding:0 0 22px;">
                  <a href="{{ page.site.origin }}/?utm_source=mailchimp&utm_medium=email" style="text-decoration:none;border:0;">
                    <img src="{{ page.site.logoIvory }}" width="320" height="72" alt="{{ page.i18n.logoAlt }}" class="sm-full" style="display:block;width:100%;max-width:320px;height:auto;margin:0 auto;border:0;outline:none;text-decoration:none;font-family:{{ page.font.serif }};font-size:17px;line-height:22px;font-weight:{{ page.weight.display }};color:#ffffff;">
                  </a>
                </td>
              </tr>
              <tr>
                <td data-masthead-strapline align="center" style="padding:0;font-family:{{ page.font.serif }};font-size:20px;line-height:27px;mso-line-height-rule:exactly;font-weight:{{ page.weight.display }};color:#ffffff;">
                  {{ page.mastheadStrapline }}
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr data-email-masthead-end>
    <td data-masthead-descriptor align="center" bgcolor="{{ page.brand.white }}" class="dm-surface sm-gutter" style="background-color:{{ page.brand.white }};padding:18px 32px 22px;font-family:{{ page.font.sans }};font-size:11px;line-height:17px;mso-line-height-rule:exactly;font-weight:{{ page.weight.medium }};letter-spacing:1.3px;text-transform:uppercase;color:{{ page.brand.muted }};">
      {{ page.mastheadDescriptor }}
    </td>
  </tr>
</if>
<else>
  <tr>
    <td align="{{ page.start }}" bgcolor="{{ page.brand.green }}" class="sm-gutter" style="background-color:{{ page.brand.green }};padding:32px;">
      <table data-email-masthead-table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
        <tr>
          <td valign="middle" class="sm-stack" style="width:62%;">
            <a href="{{ page.site.origin }}/?utm_source=mailchimp&utm_medium=email" style="text-decoration:none;border:0;">
              <img src="{{ page.site.logoIvory }}" width="{{ page.site.logoWidth }}" height="{{ page.site.logoHeight }}" alt="{{ page.i18n.logoAlt }}" style="display:block;width:{{ page.site.logoWidth }}px;height:auto;border:0;outline:none;text-decoration:none;font-family:{{ page.font.serif }};font-size:17px;line-height:22px;font-weight:{{ page.weight.display }};color:{{ page.brand.onGreen }};">
            </a>
          </td>
          <if condition="page.edition">
            <td data-masthead-edition align="{{ page.end }}" valign="middle" class="sm-stack" style="width:38%;font-family:{{ page.font.sans }};font-size:{{ page.scale.ui.size }}px;line-height:{{ page.scale.ui.leading }}px;mso-line-height-rule:exactly;font-weight:{{ page.weight.medium }};letter-spacing:{{ page.track.normal }};color:{{ page.brand.gold }};">
              {{ page.edition }}
            </td>
          </if>
        </tr>
      </table>
    </td>
  </tr>
</else>
