<!-- Development or golf-course card using the approved white editorial hierarchy. -->
<td data-component="entity-card" width="50%" valign="top" class="sm-stack" style="width:50%;padding:0 6px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" height="{{ cardheight }}" class="dm-border sm-equal-card" style="width:100%;height:{{ cardheight }}px;border:1px solid {{ page.brand.border }};">
    <tr height="170" class="sm-equal-card-row"><td height="170" valign="top" class="sm-equal-card-row" style="height:170px;padding:0;font-size:0;line-height:0;"><a href="{{ href }}" style="text-decoration:none;border:0;"><img src="{{ src }}" alt="{{ alt }}" width="255" height="170" class="sm-full" style="display:block;width:100%;max-width:255px;height:auto;border:0;outline:none;text-decoration:none;font-family:{{ page.font.sans }};font-size:{{ page.scale.ui.size }}px;line-height:{{ page.scale.ui.leading }}px;color:{{ page.brand.charcoal }};background-color:{{ page.brand.border }};"></a></td></tr>
    <tr height="{{ bodyheight }}" class="sm-equal-card-row"><td valign="top" bgcolor="{{ page.brand.white }}" class="dm-surface sm-card-inner" style="background-color:{{ page.brand.white }};padding:20px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
        <if condition="label"><tr><td class="dm-muted" style="padding:0 0 8px;font-family:{{ page.font.sans }};font-size:11px;line-height:15px;mso-line-height-rule:exactly;font-weight:{{ page.weight.medium }};letter-spacing:1.6px;text-transform:uppercase;color:{{ page.brand.muted }};">{{ label }}</td></tr></if>
        <tr><td style="padding:0 0 10px;"><h3 style="margin:0;font-family:{{ page.font.serif }};font-size:{{ page.scale.h3.size }}px;line-height:{{ page.scale.h3.leading }}px;mso-line-height-rule:exactly;font-weight:{{ page.weight.body }};"><a href="{{ href }}" class="dm-accent" style="color:{{ page.brand.green }};text-decoration:none;">{{ title }}</a></h3></td></tr>
        <if condition="price"><tr><td class="dm-ink" style="padding:0 0 8px;font-family:{{ page.font.sans }};font-size:{{ page.scale.body.size }}px;line-height:{{ page.scale.body.leading }}px;mso-line-height-rule:exactly;font-weight:{{ page.weight.medium }};color:{{ page.brand.charcoal }};">{{ price }}</td></tr></if>
        <if condition="status"><tr><td class="dm-accent" style="padding:0 0 6px;font-family:{{ page.font.sans }};font-size:{{ page.scale.ui.size }}px;line-height:{{ page.scale.ui.leading }}px;mso-line-height-rule:exactly;font-weight:{{ page.weight.medium }};color:{{ page.brand.green }};">{{ status }}</td></tr></if>
        <if condition="completion"><tr><td class="dm-muted" style="padding:0;font-family:{{ page.font.sans }};font-size:{{ page.scale.legal.size }}px;line-height:{{ page.scale.legal.leading }}px;mso-line-height-rule:exactly;color:{{ page.brand.muted }};">{{ completion }}</td></tr></if>
        <if condition="cta"><tr><td style="padding:14px 0 0;font-family:{{ page.font.sans }};font-size:{{ page.scale.ui.size }}px;line-height:{{ page.scale.ui.leading }}px;mso-line-height-rule:exactly;font-weight:{{ page.weight.medium }};"><a href="{{ href }}" class="dm-accent" style="color:{{ page.brand.green }};text-decoration:underline;text-underline-offset:2px;">{{ cta }}</a></td></tr></if>
      </table>
    </td></tr>
  </table>
</td>
