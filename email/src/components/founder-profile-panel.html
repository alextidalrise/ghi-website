<tr data-component="founder-profile-panel">
  <td class="sm-gutter" style="background-color: {{ page.brand.white }}; padding: 0 32px 40px;" mc:edit="{{ edit === '' ? 'founder_profile_panel' : edit }}">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width: 100%; background-color: #edf5f0; border: 1px solid #d8e6df;">
      <tr>
        <td width="62%" valign="top" class="sm-stack sm-card-inner" style="width: 62%; padding: 28px;">
          <h2 style="margin: 0 0 14px; font-family: {{ page.font.serif }}; font-size: 24px; line-height: 29px; color: {{ page.brand.green }};">{{ title }}</h2>
          <div style="font-family: {{ page.font.sans }}; font-size: 15px; line-height: 25px; color: {{ page.brand.charcoal }};">{{ body }}</div>
        </td>
        <td width="38%" valign="top" class="sm-stack" style="width: 38%; background-color: {{ page.brand.green }};"><img src="{{ src }}" width="202" alt="{{ alt }}" style="display: block; width: 100%; height: auto; border: 0;"><div style="padding: 12px 14px; font-family: {{ page.font.sans }}; font-size: 12px; line-height: 18px; color: {{ page.brand.white }};"><strong style="display: block; font-size: 14px;">{{ name }}</strong><br>{{ role }}</div></td>
      </tr>
    </table>
  </td>
</tr>
