<!-- Destination feature: image and copy are one coherent, responsive unit. -->
<tr data-component="destination-feature">
  <td bgcolor="{{ page.brand.white }}" class="dm-surface sm-gutter" style="background-color:{{ page.brand.white }};padding:0 32px {{ gap === '' ? 32 : gap }}px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" class="dm-border" style="width:100%;border:1px solid {{ page.brand.border }};">
      <tr>
        <td width="44%" valign="top" class="sm-stack" style="width:44%;padding:0;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
            <tr><td style="padding:0;font-size:0;line-height:0;"><a href="{{ href }}" style="text-decoration:none;border:0;"><img src="{{ src }}" alt="{{ alt }}" width="236" height="{{ imageheight || 236 }}" class="sm-full" style="display:block;width:100%;max-width:236px;height:auto;border:0;"></a></td></tr>
            <if condition="label"><tr><td bgcolor="{{ page.brand.green }}" style="background-color:{{ page.brand.green }};padding:7px 9px;font-family:{{ page.font.sans }};font-size:10px;line-height:14px;color:{{ page.brand.onGreen }};">{{ label }}</td></tr></if>
          </table>
        </td>
        <td width="56%" valign="top" class="sm-stack sm-card-copy" style="width:56%;padding:20px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
            <tr><td style="padding:0 0 14px;"><h3 style="margin:0;font-family:{{ page.font.serif }};font-size:26px;line-height:32px;font-weight:{{ page.weight.body }};"><a href="{{ href }}" class="dm-accent" style="color:{{ page.brand.green }};text-decoration:underline;text-underline-offset:4px;">{{ title }}</a></h3></td></tr>
            <tr><td class="dm-ink" style="padding:0 0 14px;font-family:{{ page.font.sans }};font-size:15px;line-height:23px;mso-line-height-rule:exactly;font-weight:{{ page.weight.body }};color:{{ page.brand.charcoal }};"><yield></yield></td></tr>
            <tr><td style="padding:0;"><table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;"><tr><td bgcolor="{{ page.brand.green }}" align="center" style="background-color:{{ page.brand.green }};padding:7px 10px;font-family:{{ page.font.sans }};font-size:10px;line-height:14px;font-weight:{{ page.weight.medium }};letter-spacing:.7px;text-transform:uppercase;"><a href="{{ href }}" style="display:block;color:{{ page.brand.onGreen }};text-decoration:none;">{{ cta }}</a></td></tr></table></td></tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
