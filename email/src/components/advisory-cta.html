<!-- Quiet advisory CTA (v1.1): centred panel inside the content column, button below copy. Subordinate to the final campaign action. -->
<tr data-component="advisory-cta">
  <td bgcolor="{{ page.brand.white }}" class="dm-surface sm-gutter" style="background-color:{{ page.brand.white }};padding:32px;" mc:edit="{{ edit }}">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="{{ tone === 'white' ? page.brand.white : page.brand.onGreen }}" style="width:100%;background-color:{{ tone === 'white' ? page.brand.white : page.brand.onGreen }};{{ tone === 'white' ? 'border:1px solid ' + page.brand.border + ';' : '' }}">
      <tr>
        <td align="center" style="padding:34px 28px 10px;">
          <h3 class="dm-accent" style="margin:0 auto;max-width:380px;font-family:{{ page.font.serif }};font-size:{{ page.scale.h3.size }}px;line-height:{{ page.scale.h3.leading }}px;mso-line-height-rule:exactly;font-weight:{{ page.weight.body }};color:{{ page.brand.green }};">{{ title }}</h3>
        </td>
      </tr>
      <tr>
        <td align="center" class="dm-ink" style="padding:0 28px 22px;font-family:{{ page.font.sans }};font-size:{{ page.scale.ui.size }}px;line-height:{{ page.scale.ui.leading }}px;mso-line-height-rule:exactly;color:{{ page.brand.charcoal }};"><yield></yield></td>
      </tr>
      <tr>
        <td align="center" style="padding:0 28px 34px;">
          <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" width="240" class="sm-full" style="width:240px;border-collapse:separate;"><tr><td align="center" bgcolor="{{ page.brand.green }}" style="background-color:{{ page.brand.green }};border:1px solid {{ page.brand.green }};padding:13px 20px;"><a href="{{ href }}" style="display:block;font-family:{{ page.font.sans }};font-size:14px;line-height:20px;mso-line-height-rule:exactly;font-weight:{{ page.weight.medium }};letter-spacing:0.06em;color:{{ page.brand.onGreen }};text-decoration:none;">{{ cta }}</a></td></tr></table>
        </td>
      </tr>
    </table>
  </td>
</tr>
