<tr data-component="partner-to-ghi-transition">
  <td class="sm-gutter" style="background-color: {{ page.brand.white }}; padding: 40px 32px;" mc:edit="{{ edit === '' ? 'partner_to_ghi_transition' : edit }}">
    <div style="font-family: {{ page.font.sans }}; font-size: 11px; line-height: 16px; letter-spacing: {{ page.track.wide }}; text-transform: uppercase; color: {{ page.brand.muted }};">{{ label }}</div>
    <h2 style="margin: 10px 0 14px; font-family: {{ page.font.serif }}; font-size: 24px; line-height: 29px; color: {{ page.brand.green }};">{{ title }}</h2>
    <div style="font-family: {{ page.font.sans }}; font-size: 15px; line-height: 25px; color: {{ page.brand.charcoal }};">{{ body }}</div>
  </td>
</tr>
