<!-- Independent partner identity in a fully bordered box (v1.1). The border sits on the cell itself so cells in a row share height natively (no percentage heights, which WebKit mis-resolves once cells stack). A right-hand cell emits the 16px gutter before itself. -->
<if condition="side === 'right'"><td class="sm-grid-gap" width="16" style="width:16px;font-size:0;line-height:0;">&nbsp;</td></if>
<td data-component="partner-cell" mc:edit="{{ edit }}" width="50%" valign="top" align="center" class="sm-stack dm-border dm-surface sm-card-inner" style="width:50%;border:1px solid {{ page.brand.border }};background-color:{{ page.brand.white }};padding:20px;">
    <if condition="src"><a href="{{ href }}" style="text-decoration:none;border:0;"><img src="{{ src }}" alt="{{ alt }}" width="180" height="48" style="display:block;width:100%;max-width:180px;height:auto;margin:0 auto 12px;border:0;outline:none;text-decoration:none;font-family:{{ page.font.sans }};font-size:{{ page.scale.ui.size }}px;line-height:{{ page.scale.ui.leading }}px;color:{{ page.brand.charcoal }};background-color:{{ page.brand.white }};"></a></if>
    <h3 style="margin:0 0 6px;font-family:{{ page.font.serif }};font-size:{{ page.scale.h3.size }}px;line-height:{{ page.scale.h3.leading }}px;mso-line-height-rule:exactly;font-weight:{{ page.weight.body }};"><a href="{{ href }}" class="dm-accent" style="color:{{ page.brand.green }};text-decoration:underline;">{{ title }}</a></h3>
    <div class="dm-muted" style="font-family:{{ page.font.sans }};font-size:{{ page.scale.legal.size }}px;line-height:{{ page.scale.legal.leading }}px;mso-line-height-rule:exactly;color:{{ page.brand.muted }};">{{ label }}</div>
</td>
