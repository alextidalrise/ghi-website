<!-- Independent partner identity in a fully bordered box (v1.2). The border sits on the cell itself so cells in a row share height natively (no percentage heights, which WebKit mis-resolves once cells stack). A right-hand cell emits the 16px gutter before itself.
  tone: default = white box, grey border, underlined green title, muted label.
        on-green = solid brand-green box, ivory title (no underline; display:block so it reads as a button, like the primary CTA) and ivory label: the primary-button treatment,
        used for the Need a Lawyer / Need a Mortgage adviser boxes. Dark mode keeps the fill and adds the sage .dm-cta-edge border, as the primary button does. -->
<if condition="side === 'right'"><td class="sm-grid-gap" width="16" style="width:16px;font-size:0;line-height:0;">&nbsp;</td></if>
<td data-component="partner-cell" mc:edit="{{ edit }}" width="50%" valign="top" align="center" bgcolor="{{ tone === 'on-green' ? page.brand.green : page.brand.white }}" class="sm-stack sm-card-inner {{ tone === 'on-green' ? 'dm-cta-edge' : 'dm-border dm-surface' }}" style="width:50%;border:1px solid {{ tone === 'on-green' ? page.brand.green : page.brand.border }};background-color:{{ tone === 'on-green' ? page.brand.green : page.brand.white }};padding:20px;">
    <if condition="src"><a href="{{ href }}" style="text-decoration:none;border:0;"><img src="{{ src }}" alt="{{ alt }}" width="180" height="48" style="display:block;width:100%;max-width:180px;height:auto;margin:0 auto 12px;border:0;outline:none;text-decoration:none;font-family:{{ page.font.sans }};font-size:{{ page.scale.ui.size }}px;line-height:{{ page.scale.ui.leading }}px;color:{{ page.brand.charcoal }};background-color:{{ page.brand.white }};"></a></if>
    <h3 style="margin:0 0 6px;font-family:{{ page.font.serif }};font-size:{{ page.scale.h3.size }}px;line-height:{{ page.scale.h3.leading }}px;mso-line-height-rule:exactly;font-weight:{{ page.weight.body }};"><a href="{{ href }}" class="{{ tone === 'on-green' ? '' : 'dm-accent' }}" style="{{ tone === 'on-green' ? 'display:block;' : '' }}color:{{ tone === 'on-green' ? page.brand.onGreen : page.brand.green }};text-decoration:{{ tone === 'on-green' ? 'none' : 'underline' }};">{{ title }}</a></h3>
    <div class="{{ tone === 'on-green' ? '' : 'dm-muted' }}" style="font-family:{{ page.font.sans }};font-size:{{ page.scale.legal.size }}px;line-height:{{ page.scale.legal.leading }}px;mso-line-height-rule:exactly;color:{{ tone === 'on-green' ? page.brand.onGreen : page.brand.muted }};">{{ label }}</div>
</td>
