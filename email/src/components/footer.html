<!--
  Footer — LOCKED system content. Not campaign-editable, not removable.

  Everything Mailchimp and the law require lives here: unsubscribe, update
  preferences, physical mailing address, permission reminder, view in browser.
  `bin/validate.mjs` fails the build if any of them go missing, so a campaign
  cannot ship without them even if someone edits the layout.

  Reading order is deliberate and matches the plain-text version: what this is,
  why you are getting it, where we are, what you can do about it.

  Green ground, like the masthead. The two bookend the white editorial body and
  give the required content a surface that survives forced dark-mode inversion.
-->

<!-- Gold hairline. The Emphasis Ladder's edge treatment for a green band. -->
<tr>
  <td
    height="1"
    bgcolor="{{ page.brand.gold }}"
    style="background-color: {{ page.brand.gold }}; height: 1px; line-height: 1px; font-size: 0;"
  >&nbsp;</td>
</tr>

<tr>
  <td
    align="{{ page.start }}"
    bgcolor="{{ page.brand.green }}"
    class="sm-gutter"
    style="background-color: {{ page.brand.green }}; padding: 40px 32px;"
  >
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width: 100%;">

      <!-- Permission reminder. Why this person is receiving this. -->
      <tr>
        <td
          align="{{ page.start }}"
          style="padding: 0 0 16px; font-family: {{ page.font.sans }}; font-size: {{ page.scale.legal.size }}px; line-height: {{ page.scale.legal.leading }}px; mso-line-height-rule: exactly; font-weight: {{ page.weight.body }}; color: {{ page.brand.onGreen }};"
        >
          {{ page.i18n.permissionReminder }}
        </td>
      </tr>

      <!--
        Physical mailing address. *|LIST:ADDRESS|* resolves from the audience's
        own settings, so it is correct by construction and cannot drift out of
        date in a hard-coded string.
      -->
      <tr>
        <td
          align="{{ page.start }}"
          style="padding: 0 0 16px; font-family: {{ page.font.sans }}; font-size: {{ page.scale.legal.size }}px; line-height: {{ page.scale.legal.leading }}px; mso-line-height-rule: exactly; font-weight: {{ page.weight.body }}; color: {{ page.brand.onGreen }};"
        >
          *|LIST:COMPANY|*, *|LIST:ADDRESS|*
        </td>
      </tr>

      <!--
        Required actions. Gold on green measures 6.86:1, and each is underlined
        at rest: there is no hover in email, so colour alone would be the only
        signal that these are links, which WCAG 1.4.1 does not allow.

        `*|ARCHIVE|*` emits a complete <a> element, not a URL, so it cannot be
        wrapped in one. Its label comes from Mailchimp's campaign settings; the
        localised label below it is ours.
      -->
      <tr>
        <td
          align="{{ page.start }}"
          style="padding: 0 0 20px; font-family: {{ page.font.sans }}; font-size: {{ page.scale.legal.size }}px; line-height: 22px; mso-line-height-rule: exactly; font-weight: {{ page.weight.body }}; color: {{ page.brand.onGreen }};"
        >
          <a
            href="*|ARCHIVE_PAGE_URL|*"
            style="color: {{ page.brand.gold }}; text-decoration: underline; text-underline-offset: 2px; font-family: {{ page.font.sans }}; font-size: {{ page.scale.legal.size }}px;"
          >{{ page.i18n.viewInBrowser }}</a>
          <span style="color: {{ page.brand.onGreen }};">&nbsp;&middot;&nbsp;</span>
          <a
            href="*|UPDATE_PROFILE|*"
            style="color: {{ page.brand.gold }}; text-decoration: underline; text-underline-offset: 2px; font-family: {{ page.font.sans }}; font-size: {{ page.scale.legal.size }}px;"
          >{{ page.i18n.updatePreferences }}</a>
          <span style="color: {{ page.brand.onGreen }};">&nbsp;&middot;&nbsp;</span>
          <a
            href="*|UNSUB|*"
            style="color: {{ page.brand.gold }}; text-decoration: underline; text-underline-offset: 2px; font-family: {{ page.font.sans }}; font-size: {{ page.scale.legal.size }}px;"
          >{{ page.i18n.unsubscribe }}</a>
        </td>
      </tr>

      <tr>
        <td
          align="{{ page.start }}"
          style="padding: 0; font-family: {{ page.font.sans }}; font-size: {{ page.scale.legal.size }}px; line-height: {{ page.scale.legal.leading }}px; mso-line-height-rule: exactly; font-weight: {{ page.weight.body }}; color: {{ page.brand.onGreen }};"
        >
          &copy; *|CURRENT_YEAR|* Golf Homes International. {{ page.i18n.footerRights }}
        </td>
      </tr>

    </table>
  </td>
</tr>
