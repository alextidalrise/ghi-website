<td data-component="compact-property-card" width="50%" valign="top" class="sm-stack sm-card-cell" style="width: 50%; padding: 0 8px; vertical-align: top;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" height="{{ cardheight }}" class="dm-border sm-equal-card" style="width: 100%; height: {{ cardheight }}px; border: 1px solid {{ page.brand.border }}; background-color: {{ page.brand.white }};">
    <tr><td valign="top"><a href="{{ href }}" style="text-decoration: none;"><img src="{{ src }}" width="260" height="173" alt="{{ alt }}" style="display: block; width: 100%; height: 173px; object-fit: cover; border: 0;"></a></td></tr>
    <tr><td valign="top" class="sm-card-inner" style="padding: 14px;" mc:edit="{{ edit === '' ? 'compact_property_card' : edit }}"><div style="font-family: {{ page.font.sans }}; font-size: 10px; line-height: 15px; letter-spacing: {{ page.track.wide }}; text-transform: uppercase; color: {{ page.brand.muted }};">{{ location }}</div><h3 style="margin: 4px 0; font-family: {{ page.font.serif }}; font-size: 18px; line-height: 23px; color: {{ page.brand.green }};"><a href="{{ href }}" style="color: {{ page.brand.green }}; text-decoration: none;">{{ title }}</a></h3><div style="font-family: {{ page.font.sans }}; font-size: 13px; line-height: 20px; color: {{ page.brand.charcoal }};">{{ price }}<br>{{ bedrooms }} bedrooms · GHI reference {{ reference }}<br><a href="{{ href }}" style="color: {{ page.brand.green }}; text-decoration: underline;">{{ cta }}</a></div></td></tr>
  </table>
</td>
