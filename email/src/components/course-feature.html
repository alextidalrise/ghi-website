<!-- Paired golf-course card with an image-led field and lower-left dark-green information panel. -->
<td data-component="course-feature" width="50%" valign="top" class="sm-stack" style="width:50%;padding:0 6px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
    <tr>
      <td background="{{ src }}" bgcolor="{{ page.brand.border }}" width="100%" height="300" valign="bottom" role="img" aria-label="{{ alt }}" style="width:100%;height:300px;background-image:url('{{ src }}');background-position:center bottom;background-size:cover;background-repeat:no-repeat;">
        <!--[if gte mso 9]>
        <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:262px;height:300px;">
          <v:fill type="frame" src="{{ src }}" color="{{ page.brand.border }}" />
          <v:textbox inset="0,0,0,0">
        <![endif]-->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" height="300" style="width:100%;height:300px;">
          <tr><td height="118" style="height:118px;padding:0;font-size:0;line-height:0;"><a href="{{ href }}" aria-label="View {{ title }}" style="display:block;height:118px;font-size:0;line-height:118px;color:transparent;text-decoration:none;">&nbsp;</a></td></tr>
          <tr>
            <td valign="bottom" style="padding:0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="88%" style="width:88%;">
                <tr>
                  <td bgcolor="{{ page.brand.green }}" style="background-color:{{ page.brand.green }};padding:13px 16px;">
                    <h3 style="margin:0 0 6px;font-family:{{ page.font.serif }};font-size:18px;line-height:23px;font-weight:{{ page.weight.body }};"><a href="{{ href }}" style="color:{{ page.brand.onGreen }};text-decoration:none;">{{ title }}</a></h3>
                    <div style="font-family:{{ page.font.sans }};font-size:9px;line-height:14px;letter-spacing:1.2px;text-transform:uppercase;color:{{ page.brand.onGreen }};">{{ label }}</div>
                    <div style="height:1px;margin:10px 0;background-color:{{ page.brand.border }};font-size:0;line-height:0;">&nbsp;</div>
                    <a href="{{ href }}" style="font-family:{{ page.font.sans }};font-size:11px;line-height:16px;font-weight:{{ page.weight.medium }};letter-spacing:1.1px;text-transform:uppercase;color:{{ page.brand.onGreen }};text-decoration:none;">{{ cta }}</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
        <!--[if gte mso 9]>
          </v:textbox>
        </v:rect>
        <![endif]-->
      </td>
    </tr>
  </table>
</td>
