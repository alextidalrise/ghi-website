<!-- Buying-guide card with live text, not baked artwork. -->
<td data-component="guide-card" width="{{ layout === 'full' ? '100%' : '50%' }}" valign="top" class="sm-stack" style="width:{{ layout === 'full' ? '100%' : '50%' }};padding:0 {{ layout === 'full' ? 0 : 6 }}px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" height="{{ compact ? 320 : (layout === 'full' ? 500 : 460) }}" class="sm-equal-card" style="width:100%;height:{{ compact ? 320 : (layout === 'full' ? 500 : 460) }}px;"><tr><td bgcolor="{{ page.brand.green }}" valign="top" class="sm-card-inner" style="background-color:{{ page.brand.green }};padding:{{ compact ? 40 : (layout === 'full' ? 48 : 28) }}px;">
    <div style="display:inline-block;border:1px solid {{ page.brand.border }};padding:8px 10px;font-family:{{ page.font.sans }};font-size:11px;line-height:15px;letter-spacing:1.8px;text-transform:uppercase;color:{{ page.brand.onGreen }};">{{ label }}</div>
    <h3 style="margin:28px 0 {{ compact ? 40 : 20 }}px;font-family:{{ page.font.serif }};font-size:{{ compact ? 38 : (layout === 'full' ? 34 : 26) }}px;line-height:{{ compact ? 46 : (layout === 'full' ? 42 : 32) }}px;font-weight:{{ page.weight.body }};"><a href="{{ href }}" style="color:{{ page.brand.onGreen }};text-decoration:underline;text-underline-offset:5px;">{{ title }}</a></h3>
    <if condition="!compact"><div style="padding:0 0 32px;font-family:{{ page.font.sans }};font-size:17px;line-height:27px;color:{{ page.brand.onGreen }};"><yield></yield></div></if>
    <a href="{{ href }}" style="font-family:{{ page.font.sans }};font-size:13px;line-height:20px;font-weight:{{ page.weight.medium }};letter-spacing:1px;text-transform:uppercase;color:{{ page.brand.onGreen }};text-decoration:none;">{{ cta }} <span style="color:{{ page.brand.gold }};">→</span></a>
  </td></tr></table>
</td>
