<!-- Buying-guide card with live text, not baked artwork. -->
<td data-component="guide-card" width="50%" valign="top" class="sm-stack" style="width:50%;padding:0 6px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;"><tr><td bgcolor="{{ page.brand.green }}" class="sm-card-inner" style="background-color:{{ page.brand.green }};padding:24px;">
    <div style="padding:0 0 10px;font-family:{{ page.font.sans }};font-size:11px;line-height:15px;mso-line-height-rule:exactly;letter-spacing:{{ page.track.normal }};color:{{ page.brand.gold }};">{{ label }}</div>
    <h3 style="margin:0 0 12px;font-family:{{ page.font.serif }};font-size:{{ page.scale.h3.size }}px;line-height:{{ page.scale.h3.leading }}px;mso-line-height-rule:exactly;font-weight:{{ page.weight.body }};color:{{ page.brand.onGreen }};">{{ title }}</h3>
    <div style="padding:0 0 16px;font-family:{{ page.font.sans }};font-size:{{ page.scale.ui.size }}px;line-height:{{ page.scale.ui.leading }}px;mso-line-height-rule:exactly;color:{{ page.brand.onGreen }};"><yield></yield></div>
    <a href="{{ href }}" style="font-family:{{ page.font.sans }};font-size:{{ page.scale.ui.size }}px;line-height:{{ page.scale.ui.leading }}px;mso-line-height-rule:exactly;font-weight:{{ page.weight.medium }};color:{{ page.brand.gold }};text-decoration:underline;">{{ cta }}</a>
  </td></tr></table>
</td>
