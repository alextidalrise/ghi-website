<!-- Buying-guide card with live text, not baked artwork. -->
<td data-component="guide-card" width="50%" valign="top" class="sm-stack" style="width:50%;padding:0 6px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" height="460" class="sm-equal-card" style="width:100%;height:460px;"><tr><td bgcolor="{{ page.brand.green }}" valign="top" class="sm-card-inner" style="background-color:{{ page.brand.green }};padding:28px;">
    <div style="display:inline-block;border:1px solid {{ page.brand.border }};padding:8px 10px;font-family:{{ page.font.sans }};font-size:11px;line-height:15px;letter-spacing:1.8px;text-transform:uppercase;color:{{ page.brand.onGreen }};">{{ label }}</div>
    <h3 style="margin:24px 0 16px;font-family:{{ page.font.serif }};font-size:26px;line-height:32px;font-weight:{{ page.weight.body }};"><a href="{{ href }}" style="color:{{ page.brand.onGreen }};text-decoration:underline;text-underline-offset:5px;">{{ title }}</a></h3>
    <div style="padding:0 0 24px;font-family:{{ page.font.sans }};font-size:15px;line-height:23px;color:{{ page.brand.onGreen }};"><yield></yield></div>
    <a href="{{ href }}" style="font-family:{{ page.font.sans }};font-size:13px;line-height:18px;font-weight:{{ page.weight.medium }};letter-spacing:1.2px;text-transform:uppercase;color:{{ page.brand.onGreen }};text-decoration:none;">{{ cta }} <span style="color:{{ page.brand.gold }};">→</span></a>
  </td></tr></table>
</td>
